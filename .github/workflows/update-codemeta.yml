name: Update CodeMeta

on:
  push:
    branches: [main, master]
    paths:
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'CITATION.cff'
      - 'codemeta.json'
      - '.github/workflows/update-codemeta.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate-codemeta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update codemeta.json (preserve existing values)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            proycon/codemeta-harvester
          # Note: --regen is intentionally omitted so the existing
          # codemeta.json is treated as the highest-priority source.

      - name: Show resulting file
        run: |
          echo "=== codemeta.json ==="
          cat codemeta.json || echo "File not found"
          echo "====================="

      - name: Commit changes if any
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add codemeta.json

          if git diff --staged --quiet; then
            echo "No changes to codemeta.json"
          else
            git commit -m "chore: update codemeta.json [skip ci]"
            git push
          fi

  # Optional: keep CITATION.cff synchronised with the updated codemeta.json
  update-citation-cff:
    needs: generate-codemeta
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Convert codemeta.json → CITATION.cff
        uses: caltechlibrary/codemeta2cff@main

      - name: Commit CITATION.cff if changed
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update CITATION.cff from codemeta.json [skip ci]"
          add: "CITATION.cff"
          default_author: github_actions