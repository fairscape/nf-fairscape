# Build + unit tests. Deliberately no Python and no Nextflow: this job answers
# "does the plugin compile and do its own tests pass", nothing else.
#
# The parity suite (nextflow.prov.parity) SKIPS here, because fairscape-cli is not
# installed -- by design, so `make test` stays runnable without a Python
# environment. It runs for real in parity.yml. The end-to-end pipeline run and
# RO-Crate 1.2 validation moved to crate.yml.
name: nf-fairscape CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build nf-fairscape
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java_version: [17]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      # setup-java@v1 silently ignored `distribution`; v4 requires and honours it
      - name: Setup Java ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java_version}}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Unit tests
        run: make test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Assemble the plugin
        run: make assemble
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test
          retention-days: 14
