
plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = project.file('VERSION').text.trim()

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'fairscape'
    className = 'nextflow.prov.ProvPlugin'
    // Shown next to the plugin name in the registry listing.
    description = 'Writes a FAIRSCAPE EVI RO-Crate describing every Nextflow pipeline run'
    extensionPoints = [
        'nextflow.prov.FairscapeConfig',
        'nextflow.prov.ProvObserverFactory'
    ]
}

tasks.withType(Test).configureEach {
    final parityDir = System.getProperty('parityDir')
    if( parityDir ) {
        systemProperty 'parityDir', parityDir
        systemProperty 'parityStep', System.getProperty('parityStep', 'all')
        outputs.upToDateWhen { false }
    }
}
